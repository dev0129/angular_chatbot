name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bot-client:
    name: Bot client
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bot-client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: bot-client/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-client-dist
          path: bot-client/dist
          retention-days: 1

  functions:
    name: Firebase functions
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-lib
          path: functions/lib
          retention-days: 1

  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs:
      - bot-client
      - functions
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      (vars.FIREBASE_DEPLOY_ENABLED == 'true' || secrets.FIREBASE_SERVICE_ACCOUNT != '' || secrets.FIREBASE_TOKEN != '')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bot-client artifact
        uses: actions/download-artifact@v4
        with:
          name: bot-client-dist
          path: bot-client/dist

      - name: Download functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-lib
          path: functions/lib

      - name: Prepare Firebase config for deploy
        run: node -e "const config=require('./firebase.json'); delete config.hosting.predeploy; delete config.functions.predeploy; require('fs').writeFileSync('firebase.ci.json', JSON.stringify(config, null, 2));"

      - name: Authenticate to Firebase
        if: secrets.FIREBASE_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy hosting and functions
        run: npx firebase-tools@13 deploy --config firebase.ci.json --only hosting,functions --project events-chatbot --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
